<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Shared Sky">
  <!-- Navy surface (CSS clips this to a circle) -->
  <rect width="512" height="512" fill="#071327"/>

  <defs>
    <style>
      .ss-line { fill:none; stroke:#ab3227; stroke-linecap:round; stroke-linejoin:round; }
      .ss-grid { fill:none; stroke:#ab3227; stroke-linecap:round; opacity:0.5; }
      .ss-star { fill:#ab3227; }
    </style>
  </defs>

  <!-- Sky: crescent moon + scattered stars -->
  <path class="ss-line" stroke-width="6"
        d="M402 88 A40 40 0 1 0 402 168 A54 54 0 0 1 402 88 Z"/>
  <path class="ss-star" d="M310,108 L312.1,113.9 L318,116 L312.1,118.1 L310,124 L307.9,118.1 L302,116 L307.9,113.9 Z"/>
  <path class="ss-star" d="M126,150 L128.8,158 L136,160 L128.8,162 L126,170 L123.2,162 L116,160 L123.2,158 Z"/>
  <path class="ss-star" d="M92,266 L94.1,271.9 L100,274 L94.1,276.1 L92,282 L89.9,276.1 L84,274 L89.9,271.9 Z"/>
  <path class="ss-star" d="M430,300 L432.1,305.9 L438,308 L432.1,310.1 L430,316 L427.9,310.1 L422,308 L427.9,305.9 Z"/>

  <!-- Orbit ring (far half — sits behind the globe) -->
  <path class="ss-line" stroke-width="6" opacity="0.85"
        d="M61.8 353 A196 64 -20 0 1 430.2 219"/>

  <!-- Globe body: navy fill hides the far ring + back of the grid -->
  <circle cx="246" cy="286" r="120" fill="#071327"/>
  <circle class="ss-line" stroke-width="7" cx="246" cy="286" r="120"/>

  <!-- Wireframe: meridians + parallels -->
  <line class="ss-grid" stroke-width="4" x1="246" y1="166" x2="246" y2="406"/>
  <ellipse class="ss-grid" stroke-width="4" cx="246" cy="286" rx="64" ry="120"/>
  <ellipse class="ss-grid" stroke-width="4" cx="246" cy="286" rx="120" ry="32"/>
  <ellipse class="ss-grid" stroke-width="4" cx="246" cy="194" rx="77" ry="20"/>
  <ellipse class="ss-grid" stroke-width="4" cx="246" cy="378" rx="77" ry="20"/>

  <!-- Orbit ring (near half — crosses in front of the globe) -->
  <path class="ss-line" stroke-width="6"
        d="M61.8 353 A196 64 -20 0 0 430.2 219"/>
</svg>
