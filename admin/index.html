<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moon Roulette · Backstage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #030A18;
      --bg-2:         #071327;
      --bg-3:         #0C1E38;
      --line:         rgba(208, 180, 137, 0.46);
      --line-soft:    rgba(208, 180, 137, 0.20);
      --text:         #EAD8BF;
      --text-bright:  #F0DFC2;
      --muted:        rgba(234, 216, 191, 0.72);
      --muter:        rgba(234, 216, 191, 0.46);
      --accent:       #D4B58A;
      --accent-bright:#E5C9A0;
      --accent-deep:  #C99D57;
      --on-accent:    #0A1422;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans:  -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;

      --s-queued:     rgba(120, 150, 200, 0.18);
      --s-delivered:  rgba(100, 190, 130, 0.18);
      --s-declined:   rgba(200, 120, 70, 0.18);
      --s-blocked:    rgba(190, 70, 70, 0.18);
      --s-relaunched: rgba(150, 110, 210, 0.18);
      --s-revealed:   rgba(212, 181, 90, 0.22);

      --t-queued:     #90B0E0;
      --t-delivered:  #7CD4A0;
      --t-declined:   #E09060;
      --t-blocked:    #E07070;
      --t-relaunched: #B898E8;
      --t-revealed:   #E8C840;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; }

    /* ── Login ── */
    #loginScreen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .login-card {
      background: var(--bg-2); border: 1px solid var(--line-soft);
      border-radius: 16px; padding: 40px 36px; max-width: 380px; width: 100%;
      text-align: center;
    }
    .login-card h1 {
      font-family: var(--serif); font-size: 28px; font-weight: 400;
      color: var(--text-bright); margin-bottom: 6px;
    }
    .login-card p { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
    .login-field {
      width: 100%; padding: 11px 14px; background: var(--bg-3);
      border: 1px solid var(--line-soft); border-radius: 8px;
      color: var(--text); font-size: 14px; margin-bottom: 12px;
      outline: none; transition: border-color 0.2s;
    }
    .login-field:focus { border-color: var(--accent); }
    .btn-primary {
      width: 100%; padding: 12px; background: var(--accent); color: var(--on-accent);
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.2s; letter-spacing: 0.5px;
    }
    .btn-primary:hover { background: var(--accent-bright); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-msg { margin-top: 14px; font-size: 13px; color: var(--muted); min-height: 20px; }
    .login-msg.error { color: var(--t-blocked); }
    .login-msg.success { color: var(--t-delivered); }
    .login-link { margin-top: 10px; background: none; border: none; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; }
    .login-link:hover { color: var(--accent-bright); }
    .login-link:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── App Shell ── */
    #appShell { display: none; flex-direction: column; min-height: 100vh; }

    /* ── Top bar ── */
    .topbar {
      display: flex; align-items: center; gap: 16px;
      padding: 14px 24px; border-bottom: 1px solid var(--line-soft);
      background: var(--bg-2); position: sticky; top: 0; z-index: 10;
    }
    .topbar-title {
      font-family: var(--serif); font-size: 22px; font-weight: 400;
      color: var(--text-bright); letter-spacing: 0.3px; flex: 1;
    }
    .topbar-title span { color: var(--accent); }
    .btn-icon {
      padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line-soft);
      background: transparent; color: var(--muted); font-size: 12px;
      cursor: pointer; transition: all 0.15s; letter-spacing: 0.5px;
    }
    .btn-icon:hover { border-color: var(--accent); color: var(--accent); }
    #refreshBtn.spinning { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Body ── */
    .admin-body { flex: 1; padding: 20px 24px; max-width: 1600px; margin: 0 auto; width: 100%; }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;
    }
    .stat-chip {
      padding: 8px 16px; border-radius: 20px; font-size: 12px;
      border: 1px solid var(--line-soft); background: var(--bg-2);
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
      display: flex; align-items: center; gap: 8px;
    }
    .stat-chip:hover { border-color: var(--accent); }
    .stat-chip.active { border-color: var(--accent); background: rgba(212, 181, 138, 0.08); }
    .stat-chip .count {
      font-weight: 700; font-size: 15px; color: var(--text-bright);
    }
    .stat-chip .label { color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-size: 10px; }
    .stat-chip.all .count { color: var(--accent); }
    .stat-chip.queued    .count { color: var(--t-queued); }
    .stat-chip.delivered .count { color: var(--t-delivered); }
    .stat-chip.declined  .count { color: var(--t-declined); }
    .stat-chip.blocked   .count { color: var(--t-blocked); }
    .stat-chip.relaunched .count { color: var(--t-relaunched); }
    .stat-chip.revealed  .count { color: var(--t-revealed); }

    /* ── Search ── */
    .search-row { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
    .search-input {
      flex: 1; max-width: 360px; padding: 9px 14px;
      background: var(--bg-2); border: 1px solid var(--line-soft);
      border-radius: 8px; color: var(--text); font-size: 13px;
      outline: none; transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muter); }
    .count-label { color: var(--muter); font-size: 12px; margin-left: auto; }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line-soft); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      padding: 11px 14px; text-align: left; color: var(--muter);
      font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px;
      border-bottom: 1px solid var(--line-soft); background: var(--bg-2);
      white-space: nowrap; font-weight: 500;
    }
    tbody tr {
      border-bottom: 1px solid var(--line-soft); cursor: pointer;
      transition: background 0.12s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(212, 181, 138, 0.04); }
    tbody tr.expanded { background: rgba(212, 181, 138, 0.06); }
    td { padding: 11px 14px; vertical-align: top; color: var(--text); }

    /* ── Status badge ── */
    .badge {
      display: inline-block; padding: 2px 9px; border-radius: 12px;
      font-size: 10px; font-weight: 600; letter-spacing: 0.8px;
      text-transform: uppercase; white-space: nowrap;
    }
    .badge-queued     { background: var(--s-queued);     color: var(--t-queued); }
    .badge-delivered  { background: var(--s-delivered);  color: var(--t-delivered); }
    .badge-declined   { background: var(--s-declined);   color: var(--t-declined); }
    .badge-blocked    { background: var(--s-blocked);    color: var(--t-blocked); }
    .badge-relaunched { background: var(--s-relaunched); color: var(--t-relaunched); }
    .badge-revealed   { background: var(--s-revealed);   color: var(--t-revealed); }

    /* ── Person cell ── */
    .person { display: flex; flex-direction: column; gap: 1px; min-width: 140px; }
    .person-name { color: var(--text-bright); font-weight: 500; }
    .person-email { color: var(--muter); font-size: 11px; }
    .person-city { color: var(--muted); font-size: 11px; }
    .deleted-flag {
      display: inline-block; font-size: 9px; padding: 1px 5px;
      background: rgba(190, 70, 70, 0.2); color: var(--t-blocked);
      border-radius: 4px; margin-top: 2px; letter-spacing: 0.5px;
    }

    /* ── Message preview ── */
    .msg-preview { color: var(--muted); font-size: 12px; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .msg-preview.has-photo { color: var(--t-relaunched); font-style: italic; }

    /* ── Timestamps ── */
    .ts-cell { display: flex; flex-direction: column; gap: 2px; font-size: 11px; white-space: nowrap; }
    .ts-row { display: flex; gap: 5px; align-items: center; }
    .ts-label { color: var(--muter); font-size: 9px; text-transform: uppercase; letter-spacing: 0.8px; width: 24px; }
    .ts-val { color: var(--muted); }
    .ts-val.done { color: var(--t-delivered); }
    .ts-val.pending { color: var(--t-queued); }

    /* ── Chain cell ── */
    .chain-cell { white-space: nowrap; font-size: 11px; }
    .chain-num { color: var(--accent); font-weight: 600; }
    .chain-parent { color: var(--t-relaunched); font-size: 10px; display: block; margin-top: 2px; }

    /* ── Thread grouping ── */
    tbody tr.thread-root td:first-child { border-left: 2px solid var(--accent-deep); }
    tbody tr.thread-reply { background: rgba(12, 30, 56, 0.6); }
    tbody tr.thread-reply td:first-child { border-left: 2px solid rgba(208, 180, 137, 0.25); }
    tbody tr.thread-reply:hover { background: rgba(212, 181, 138, 0.05); }
    .thread-indent {
      display: flex; align-items: flex-start; gap: 6px;
    }
    .thread-connector {
      flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
      width: 14px; padding-top: 2px;
    }
    .thread-connector-line {
      width: 1px; flex: 1; min-height: 12px;
      background: rgba(208, 180, 137, 0.25);
    }
    .thread-connector-elbow {
      width: 8px; height: 8px;
      border-left: 1px solid rgba(208, 180, 137, 0.25);
      border-bottom: 1px solid rgba(208, 180, 137, 0.25);
      border-bottom-left-radius: 3px;
      flex-shrink: 0;
    }
    .thread-reply-label {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--muter); margin-bottom: 2px;
    }
    tbody tr.thread-last-reply td { border-bottom: 2px solid rgba(208, 180, 137, 0.12); }

    /* ── Reveal cell ── */
    .reveal-cell { font-size: 11px; color: var(--muted); }
    .reveal-full { color: var(--t-revealed); font-weight: 600; }

    /* ── Expand row ── */
    .expand-row td {
      padding: 0; cursor: default;
    }
    .expand-inner {
      padding: 18px 20px 18px 36px;
      background: rgba(7, 19, 39, 0.8);
      border-top: 1px solid var(--line-soft);
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;
    }
    .expand-section h4 {
      font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--muter); margin-bottom: 8px; font-weight: 500;
    }
    .expand-section p {
      font-size: 13px; color: var(--text); line-height: 1.6;
      word-break: break-word;
    }
    .expand-ts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
    .expand-ts-row { display: flex; flex-direction: column; gap: 1px; }
    .expand-ts-row .label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muter); }
    .expand-ts-row .val { font-size: 12px; color: var(--muted); }
    .expand-ts-row .val.done { color: var(--t-delivered); }
    .expand-ts-row .val.null { color: var(--muter); font-style: italic; }
    .id-chip {
      font-family: monospace; font-size: 11px; color: var(--muted);
      background: var(--bg-3); padding: 2px 7px; border-radius: 4px;
      cursor: pointer; transition: color 0.15s;
    }
    .id-chip:hover { color: var(--accent); }
    .id-chip.copied { color: var(--t-delivered); }

    /* ── Loading / Empty ── */
    .state-msg {
      text-align: center; padding: 60px 20px;
      color: var(--muter); font-size: 14px;
    }
    .state-msg .icon { font-size: 32px; margin-bottom: 10px; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 2px; margin-bottom: 20px; border-bottom: 1px solid var(--line-soft); }
    .tab-btn {
      padding: 10px 20px; background: transparent; border: none;
      color: var(--muter); font-size: 12px; text-transform: uppercase;
      letter-spacing: 1.2px; cursor: pointer; transition: all 0.15s;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Users table ── */
    .user-status { display: flex; flex-direction: column; gap: 2px; }
    .badge-suspended { background: rgba(190,70,70,0.18); color: var(--t-blocked); }
    .badge-active    { background: rgba(100,190,130,0.18); color: var(--t-delivered); }

    /* ── Action buttons ── */
    .btn-action {
      padding: 4px 10px; border-radius: 5px; border: 1px solid; font-size: 11px;
      cursor: pointer; transition: all 0.15s; background: transparent;
      white-space: nowrap;
    }
    .btn-suspend  { border-color: rgba(224,112,112,0.4); color: var(--t-blocked); }
    .btn-suspend:hover  { background: rgba(190,70,70,0.15); }
    .btn-unsuspend { border-color: rgba(100,190,130,0.4); color: var(--t-delivered); }
    .btn-unsuspend:hover { background: rgba(100,190,130,0.1); }
    .btn-delete-msg { border-color: rgba(224,112,112,0.4); color: var(--t-blocked); }
    .btn-delete-msg:hover { background: rgba(190,70,70,0.15); }

    /* ── Reason modal ── */
    .modal-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(3,10,24,0.85); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: var(--bg-2); border: 1px solid var(--line-soft);
      border-radius: 14px; padding: 32px 28px; max-width: 420px; width: 90%;
    }
    .modal-card h3 { font-family: var(--serif); font-size: 22px; font-weight: 400; color: var(--text-bright); margin-bottom: 6px; }
    .modal-card p { color: var(--muted); font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
    .modal-textarea {
      width: 100%; padding: 10px 13px; background: var(--bg-3);
      border: 1px solid var(--line-soft); border-radius: 8px;
      color: var(--text); font-size: 13px; resize: vertical; min-height: 80px;
      outline: none; transition: border-color 0.2s; margin-bottom: 16px;
      font-family: var(--sans);
    }
    .modal-textarea:focus { border-color: var(--accent); }
    .modal-textarea::placeholder { color: var(--muter); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-modal-cancel {
      padding: 9px 18px; border-radius: 7px; border: 1px solid var(--line-soft);
      background: transparent; color: var(--muted); font-size: 13px; cursor: pointer;
    }
    .btn-modal-confirm {
      padding: 9px 18px; border-radius: 7px; border: none;
      background: var(--t-blocked); color: #fff; font-size: 13px;
      font-weight: 600; cursor: pointer; opacity: 0.9; transition: opacity 0.15s;
    }
    .btn-modal-confirm:hover { opacity: 1; }
    .btn-modal-confirm:disabled { opacity: 0.4; cursor: not-allowed; }
    .modal-msg { font-size: 12px; color: var(--muted); margin-top: 10px; min-height: 18px; text-align: right; }

    /* ── Admin-deleted badge ── */
    .admin-del-flag {
      display: inline-block; font-size: 9px; padding: 1px 5px;
      background: rgba(190,70,70,0.2); color: var(--t-blocked);
      border-radius: 4px; margin-top: 2px; letter-spacing: 0.5px;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(212, 181, 138, 0.25); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(212, 181, 138, 0.45); }
  </style>
</head>
<body>

<!-- ── Login ── -->
<div id="loginScreen">
  <div class="login-card">
    <h1>Moon Roulette</h1>
    <p>Backstage access · admin only</p>
    <div id="loginEmailWrap"></div>
    <input id="loginOtp" type="text" class="login-field" placeholder="6-digit code" style="display:none" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
    <button id="loginBtn" class="btn-primary">Send code</button>
    <button id="resendBtn" class="login-link" style="display:none">Resend code</button>
    <div id="loginMsg" class="login-msg"></div>
  </div>
</div>

<!-- ── App ── -->
<div id="appShell">
  <header class="topbar">
    <div class="topbar-title">Moon Roulette <span>✦</span> Backstage</div>
    <button class="btn-icon" id="refreshBtn" title="Refresh data">↻ Refresh</button>
    <button class="btn-icon" id="logoutBtn">Sign out</button>
  </header>

  <main class="admin-body">
    <div class="tabs">
      <button class="tab-btn active" data-tab="roulette">Moon Roulette</button>
      <button class="tab-btn" data-tab="users">Users</button>
    </div>

    <!-- Roulette tab -->
    <div class="tab-panel active" id="tab-roulette">
    <div class="stats-bar" id="statsBar">
      <div class="stat-chip all active" data-filter="all">
        <span class="count" id="cnt-all">—</span>
        <span class="label">Total</span>
      </div>
      <div class="stat-chip queued" data-filter="queued">
        <span class="count" id="cnt-queued">0</span>
        <span class="label">Queued</span>
      </div>
      <div class="stat-chip delivered" data-filter="delivered">
        <span class="count" id="cnt-delivered">0</span>
        <span class="label">Delivered</span>
      </div>
      <div class="stat-chip declined" data-filter="declined">
        <span class="count" id="cnt-declined">0</span>
        <span class="label">Declined</span>
      </div>
      <div class="stat-chip blocked" data-filter="blocked">
        <span class="count" id="cnt-blocked">0</span>
        <span class="label">Blocked</span>
      </div>
      <div class="stat-chip relaunched" data-filter="re-launched">
        <span class="count" id="cnt-relaunched">0</span>
        <span class="label">Re-launched</span>
      </div>
      <div class="stat-chip revealed" data-filter="revealed">
        <span class="count" id="cnt-revealed">0</span>
        <span class="label">Revealed</span>
      </div>
    </div>

    <div class="search-row">
      <input id="searchInput" class="search-input" type="text" placeholder="Search by name, email, city, message…">
      <span class="count-label" id="rowCountLabel"></span>
    </div>

    <div class="table-wrap">
      <table id="dataTable">
        <thead>
          <tr>
            <th>Status</th>
            <th>Sender</th>
            <th>Recipient</th>
            <th>Message</th>
            <th>Timestamps</th>
            <th>Chain</th>
            <th>Reveal</th>
            <th>ID</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="8"><div class="state-msg"><div class="icon">◌</div>Loading…</div></td></tr>
        </tbody>
      </table>
    </div>
    </div> <!-- /tab-roulette -->

    <!-- Users tab -->
    <div class="tab-panel" id="tab-users">
      <div class="search-row">
        <input id="userSearchInput" class="search-input" type="text" placeholder="Search by name, email, city…">
        <span class="count-label" id="userRowCountLabel"></span>
      </div>
      <div class="table-wrap">
        <table id="usersTable">
          <thead>
            <tr>
              <th>Status</th>
              <th>User</th>
              <th>City</th>
              <th>Joined</th>
              <th>Last active</th>
              <th>Roulette</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="7"><div class="state-msg"><div class="icon">◌</div>Loading…</div></td></tr>
          </tbody>
        </table>
      </div>
    </div> <!-- /tab-users -->

  </main>
</div>

<!-- Reason modal -->
<div class="modal-backdrop" id="actionModal">
  <div class="modal-card">
    <h3 id="modalTitle">Confirm action</h3>
    <p id="modalDesc"></p>
    <textarea class="modal-textarea" id="modalReason" placeholder="Reason (optional but recommended)…"></textarea>
    <div class="modal-actions">
      <button class="btn-modal-cancel" id="modalCancel">Cancel</button>
      <button class="btn-modal-confirm" id="modalConfirm">Confirm</button>
    </div>
    <div class="modal-msg" id="modalMsg"></div>
  </div>
</div>

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (ADMIN_EMAILS.includes(session?.user?.email)) {
    showApp();
    loadData();
  } else {

    if (session) await sb.auth.signOut();
    showLogin('');
  }

function showLogin(msg) {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appShell').style.display = 'none';
  // Reset to the email-entry state
  otpPending = false;
  document.getElementById('loginEmail').style.display = 'block';
  document.getElementById('loginOtp').style.display = 'none';
  document.getElementById('resendBtn').style.display = 'none';
  document.getElementById('loginBtn').textContent = 'Send code';
  if (msg) setLoginMsg(msg, 'error');
}

function setLoginMsg(msg, type = '') {
  const el = document.getElementById('loginMsg');

// Login flow: send OTP, then verify
document.getElementById('loginBtn').addEventListener('click', async () => {
  const btn = document.getElementById('loginBtn');
  const emailEl = document.getElementById('loginEmail');
  const otpEl = document.getElementById('loginOtp');

  if (!otpPending) {
    const email = emailEl.value.trim().toLowerCase();
    if (!email) { setLoginMsg('Enter your email.', 'error'); return; }
    if (!ADMIN_EMAILS.includes(email)) { setLoginMsg('That email is not authorised.', 'error'); return; }
    btn.disabled = true;
    setLoginMsg('Sending code…');
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
    btn.disabled = false;
    if (error) {
      setLoginMsg(error.message, 'error');
    } else {
      otpPending = true;
      emailEl.style.display = 'none';
      otpEl.style.display = 'block';
      otpEl.focus();
      btn.textContent = 'Verify code';
      document.getElementById('resendBtn').style.display = 'block';
      setLoginMsg('Check your email for a 6-digit code.', 'success');
    }
  } else {
    const otp = otpEl.value.trim();
    const email = emailEl.value.trim().toLowerCase();
    if (otp.length < 6) { setLoginMsg('Enter the 6-digit code.', 'error'); return; }
    btn.disabled = true;
    setLoginMsg('Verifying…');
    const { error } = await sb.auth.verifyOtp({ email, token: otp, type: 'email' });
    btn.disabled = false;
    if (error) {
      setLoginMsg(error.message, 'error');
    } else {
      setLoginMsg('Verified!', 'success');
    }
  }
});

  setLoginMsg('Sending a new code…');

function buildThreadOrder(rows) {
  // Build a map of id → row and parent → children
  const byId = new Map(rows.map(r => [r.id, r]));
  const children = new Map();
  const roots = [];

  for (const r of rows) {
    if (r.parent_id && byId.has(r.parent_id)) {
      if (!children.has(r.parent_id)) children.set(r.parent_id, []);
      children.get(r.parent_id).push(r);
    } else {
      roots.push(r);
    }
  }

  // Sort roots by created_at descending (newest thread first)
  roots.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  // Flatten: root then its replies in chronological order, recursively
  const result = [];
  function flatten(r, depth) {
    result.push({ row: r, depth });
    const kids = (children.get(r.id) || []).slice().sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    for (const kid of kids) flatten(kid, depth + 1);
  }
  for (const root of roots) flatten(root, 0);
  return result;
}

        </div>

function renderTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allRows.filter(r => {
    if (activeFilter !== 'all' && r.status !== activeFilter) return false;
    if (!q) return true;
    return [r.sender_username, r.sender_email, r.sender_city, r.sender_city_profile,
            r.recipient_username, r.recipient_email, r.recipient_city, r.recipient_city_profile,
            r.message_text, r.moon_phase, r.id]
      .some(v => v && v.toLowerCase().includes(q));
  });

  document.getElementById('rowCountLabel').textContent =
    filtered.length === allRows.length
      ? `${allRows.length} messages`
      : `${filtered.length} of ${allRows.length}`;

  if (!filtered.length) {
    document.getElementById('tableBody').innerHTML =
      `<tr><td colspan="8"><div class="state-msg"><div class="icon">◌</div>No messages match.</div></td></tr>`;
    return;
  }

  const ordered = buildThreadOrder(filtered);
  const tbody = document.getElementById('tableBody');
  let html = '';

  for (let i = 0; i < ordered.length; i++) {
    const { row: r, depth } = ordered[i];
    // A reply is "last sibling" if the next item is at a shallower depth or doesn't exist
    const nextDepth = ordered[i + 1]?.depth ?? 0;
    const isLastSibling = depth > 0 && nextDepth < depth;

    html += renderRow(r, depth, isLastSibling);
    if (expandedId === r.id) html += renderExpandRow(r);
  }

  tbody.innerHTML = html;
}

function expandTs(label, val, isDone) {
  return `<div class="expand-ts-row">
    <span class="label">${label}</span>
    <span class="val ${val ? (isDone ? 'done' : '') : 'null'}">${val ? fmtDateFull(val) : '—'}</span>
  </div>`;
}

document.getElementById('tableBody').addEventListener('click', e => {

    navigator.clipboard.writeText(idChip.dataset.copy).catch(() => {});
    idChip.classList.add('copied');
    setTimeout(() => idChip.classList.remove('copied'), 1200);
    return;
  }

  const expandRow = e.target.closest('[data-expand-for]');

  const row = e.target.closest('tr[data-id]');
  if (!row) return;

  const id = row.dataset.id;
  expandedId = expandedId === id ? null : id;
  renderTable();
});

// ── Helpers ───────────────────────────────────────────────────────────────────

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const now = new Date();
  const diffMs = now - d;
  const diffH = diffMs / 3600000;
  if (diffH < 1) return `${Math.round(diffMs / 60000)}m ago`;
  if (diffH < 24) return `${Math.round(diffH)}h ago`;
  if (diffH < 48) return 'yesterday';
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: diffH > 8760 ? 'numeric' : undefined });
}

function fmtDateFull(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('en-GB', {
    day: 'numeric', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit', hour12: false
  });
}

  };
  const descs = {
    suspend: `This will immediately block ${ctx.username} from logging in. They will see an explanation on the login screen.`,
    unsuspend: `This will restore ${ctx.username}'s access to Moon Post.`,
    delete_roulette_message: 'This will silently remove the message from both users\' inboxes. The sender will not be notified.',
  };
  document.getElementById('modalTitle').textContent = titles[action];
  document.getElementById('modalDesc').textContent = descs[action];
  document.getElementById('modalReason').value = '';
  document.getElementById('modalMsg').textContent = '';
  document.getElementById('modalConfirm').disabled = false;
  document.getElementById('modalConfirm').textContent = action === 'unsuspend' ? 'Unsuspend' : action === 'suspend' ? 'Suspend' : 'Delete';
  document.getElementById('actionModal').classList.add('open');
  document.getElementById('modalReason').focus();
}

document.getElementById('modalCancel').addEventListener('click', () => {
  document.getElementById('actionModal').classList.remove('open');
  modalContext = null;
});

document.getElementById('actionModal').addEventListener('click', e => {
  if (e.target === document.getElementById('actionModal')) {
    document.getElementById('actionModal').classList.remove('open');
    modalContext = null;
  }
});

document.getElementById('modalConfirm').addEventListener('click', async () => {
  if (!modalContext) return;
  const { action, userId, messageId } = modalContext;
  const reason = document.getElementById('modalReason').value.trim();
  const confirmBtn = document.getElementById('modalConfirm');
  const msgEl = document.getElementById('modalMsg');

  confirmBtn.disabled = true;
  msgEl.textContent = 'Working…';

  const body = { action, reason: reason || null };
  if (userId)    body.target_user_id    = userId;
  if (messageId) body.target_message_id = messageId;

  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-action`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${session.access_token}`,
    },
    body: JSON.stringify(body),
  });

  const json = await res.json();
  if (!res.ok) {
    msgEl.style.color = 'var(--t-blocked)';
    msgEl.textContent = json.error || 'Something went wrong.';
    confirmBtn.disabled = false;
    return;
  }

  msgEl.style.color = 'var(--t-delivered)';
  msgEl.textContent = 'Done.';
  setTimeout(() => {
    document.getElementById('actionModal').classList.remove('open');
    modalContext = null;
    // Refresh the relevant tab data
    if (action === 'suspend' || action === 'unsuspend') {
      allUsers = [];
      loadUsers();
    }
    if (action === 'delete_roulette_message') {
      loadData();
    }
  }, 800);
});

// ── Boot ──────────────────────────────────────────────────────────────────────
// Create email input via JS so browsers have nothing to autofill in the markup
const honeypot = document.createElement('input');
honeypot.type = 'email';
honeypot.style.cssText = 'position:absolute;opacity:0;pointer-events:none;height:0;';
honeypot.tabIndex = -1;
honeypot.autocomplete = 'email';

const emailInput = document.createElement('input');
emailInput.id = 'loginEmail';
emailInput.type = 'text';
emailInput.className = 'login-field';
emailInput.placeholder = 'enter email';
emailInput.setAttribute('autocomplete', 'off');
emailInput.setAttribute('data-lpignore', 'true');
emailInput.setAttribute('data-1p-ignore', '');

const wrap = document.getElementById('loginEmailWrap');
wrap.appendChild(honeypot);
wrap.appendChild(emailInput);

// Keep clearing until user actually types something
let userHasTyped = false;
emailInput.addEventListener('input', () => { userHasTyped = true; });
const clearLoop = setInterval(() => {
  if (userHasTyped) { clearInterval(clearLoop); return; }
  if (emailInput.value) emailInput.value = '';
}, 30);

init();
</script>
</body>
</html>
